<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxy AI V3.0</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: #111116;
      border-bottom: 1px solid #292930;
    }

    .logo {
      font-size: 21px;
      font-weight: bold;
    }

    .version {
      font-size: 11px;
      color: #aaa;
      margin-left: 5px;
    }

    button {
      border: none;
      cursor: pointer;
    }

    #newChat {
      background: #24242c;
      color: white;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
    }

    #newChat:active {
      transform: scale(.96);
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px 14px 100px;
    }

    .welcome {
      text-align: center;
      margin-top: 25vh;
      color: #aaa;
    }

    .welcome h1 {
      color: white;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .welcome p {
      font-size: 14px;
    }

    .msg {
      max-width: 88%;
      padding: 12px 14px;
      margin: 10px 0;
      border-radius: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user {
      margin-left: auto;
      background: #315efb;
      border-bottom-right-radius: 5px;
    }

    .ai {
      margin-right: auto;
      background: #1d1d24;
      border-bottom-left-radius: 5px;
    }

    .thinking {
      color: #aaa;
      font-style: italic;
    }

    form {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 10px;
      background: #0b0b0f;
      border-top: 1px solid #292930;
      display: flex;
      gap: 8px;
    }

    #input {
      flex: 1;
      min-width: 0;
      padding: 13px 15px;
      border: 1px solid #33333c;
      border-radius: 14px;
      outline: none;
      background: #17171d;
      color: white;
      font-size: 15px;
    }

    #input:focus {
      border-color: #526eff;
    }

    #send {
      width: 50px;
      border-radius: 14px;
      background: #315efb;
      color: white;
      font-size: 20px;
    }

    #send:active {
      transform: scale(.94);
    }

    @media (min-width: 700px) {
      #chat {
        padding-left: 20%;
        padding-right: 20%;
      }

      form {
        padding-left: 20%;
        padding-right: 20%;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div>
      <span class="logo">🌌 Galaxy AI</span>
      <span class="version">V3.0</span>
    </div>

    <button id="newChat">＋ New Chat</button>
  </header>

  <main id="chat">

    <div id="welcome" class="welcome">
      <h1>Galaxy AI</h1>
      <p>How can I help you today?</p>
    </div>

  </main>

  <form id="form">
<button id="mic" type="button">🎙️</button>
    <input
      id="input"
      type="text"
      placeholder="Message Galaxy AI..."
      autocomplete="off"
    >

    <button id="send" type="submit">➤</button>

  </form>

</div>

<script>

const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");
const input = document.getElementById("input");
const form = document.getElementById("form");
const newChat = document.getElementById("newChat");
const mic = document.getElementById("mic");
function addMessage(text, type) 

  if (welcome) {
    welcome.style.display = "none";
  }

  const message = document.createElement("div");

  message.className = "msg " + type;
  message.textContent = text;

  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;

  return message;
}
mic.addEventListener("click", function() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Voice input is not supported.");
    return;
  }

  const recognition = new SpeechRecognition();

  recognition.lang = "en-IN";
  recognition.interimResults = false;
  recognition.continuous = false;

  recognition.start();

  recognition.onresult = function(event) {
    input.value = event.results[0][0].transcript;
  };
});

function saveChat() {

  localStorage.setItem(
    "galaxy_ai_v3_chat",
    chat.innerHTML
  );

}


function loadChat() {

  const saved = localStorage.getItem(
    "galaxy_ai_v3_chat"
  );

  if (saved) {

    chat.innerHTML = saved;

    chat.scrollTop = chat.scrollHeight;

  }

}


newChat.addEventListener("click", function() {

  localStorage.removeItem("galaxy_ai_v3_chat");

  chat.innerHTML = `
    <div id="welcome" class="welcome">
      <h1>Galaxy AI</h1>
      <p>How can I help you today?</p>
    </div>
  `;

});


form.addEventListener("submit", async function(e) {

  e.preventDefault();

  const question = input.value.trim();

  if (!question) return;

  addMessage(question, "user");

  input.value = "";

  const aiMessage = addMessage(
    "Thinking...",
    "ai thinking"
  );

  try {

    const response = await fetch("/api/chat", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: question
      })

    });


    const data = await response.json();


    if (!response.ok) {

      aiMessage.textContent =
        data.error || "Something went wrong.";

      aiMessage.classList.remove("thinking");

      return;
    }


    aiMessage.classList.remove("thinking");

    const reply =
      data.reply || "No response received.";


    aiMessage.textContent = "";

    let i = 0;


    const typing = setInterval(function() {

      aiMessage.textContent += reply[i];

      i++;

      chat.scrollTop = chat.scrollHeight;


      if (i >= reply.length) {

        clearInterval(typing);

        saveChat();

      }

    }, 15);


  } catch (error) {

    aiMessage.classList.remove("thinking");

    aiMessage.textContent =
      "Connection error. Please try again.";

  }

});


loadChat();

</script>

</body>
</html>
