<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy AI V3.0</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#08080f;
  color:#fff;
  height:100vh;
  overflow:hidden;
}

.app{
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* HEADER */
header{
  height:64px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  background:#11111a;
  border-bottom:1px solid #292936;
}

.logo{
  font-size:20px;
  font-weight:700;
}

.version{
  font-size:11px;
  color:#888;
  margin-left:6px;
}

.header-buttons{
  display:flex;
  gap:7px;
}

.header-buttons button{
  border:0;
  background:#252532;
  color:#fff;
  border-radius:10px;
  padding:9px 11px;
  font-size:13px;
  cursor:pointer;
}

/* CHAT */
#chat{
  flex:1;
  overflow-y:auto;
  padding:20px 13px 100px;
  scroll-behavior:smooth;
}

.welcome{
  text-align:center;
  margin-top:22vh;
  color:#999;
}

.welcome h1{
  color:#fff;
  font-size:30px;
  margin-bottom:8px;
}

.welcome p{
  font-size:14px;
}

/* MESSAGES */
.message{
  max-width:88%;
  padding:13px 15px;
  margin:10px 0;
  border-radius:17px;
  line-height:1.5;
  white-space:pre-wrap;
  word-break:break-word;
}

.user{
  margin-left:auto;
  background:linear-gradient(135deg,#6647f5,#167cf5);
  border-bottom-right-radius:5px;
}

.ai{
  margin-right:auto;
  background:#1c1c28;
  border-bottom-left-radius:5px;
}

.thinking{
  color:#999;
  font-style:italic;
}

/* ACTIONS */
.actions{
  display:flex;
  gap:6px;
  margin-top:9px;
}

.actions button{
  border:0;
  background:#2b2b38;
  color:#ddd;
  padding:6px 9px;
  border-radius:8px;
  font-size:12px;
  cursor:pointer;
}

/* INPUT AREA */
form{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  display:flex;
  gap:7px;
  padding:10px;
  background:#0b0b11;
  border-top:1px solid #292936;
}

#input{
  flex:1;
  min-width:0;
  border:1px solid #343442;
  outline:none;
  border-radius:14px;
  padding:13px 14px;
  background:#171720;
  color:#fff;
  font-size:15px;
}

#input:focus{
  border-color:#586cff;
}

.tool-btn{
  width:45px;
  height:46px;
  flex-shrink:0;
  border:0;
  border-radius:14px;
  background:#252532;
  color:#fff;
  font-size:18px;
  cursor:pointer;
}

#send{
  width:52px;
  height:46px;
  flex-shrink:0;
  border:0;
  border-radius:14px;
  background:#315efb;
  color:#fff;
  font-size:19px;
  cursor:pointer;
}

button:active{
  transform:scale(.94);
}

#file{
  display:none;
}

/* SETTINGS */
#settings-panel{
  display:none;
  position:fixed;
  top:70px;
  right:12px;
  width:270px;
  background:#181820;
  border:1px solid #353541;
  border-radius:16px;
  padding:16px;
  z-index:50;
  box-shadow:0 12px 35px #000;
}

#settings-panel h3{
  margin-bottom:14px;
}

.setting{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid #292936;
}

.setting button{
  border:0;
  background:#315efb;
  color:#fff;
  padding:7px 10px;
  border-radius:8px;
}

/* LIGHT MODE */
.light{
  background:#f5f5f7;
  color:#111;
}

.light header,
.light form{
  background:#fff;
  border-color:#ddd;
}

.light #input{
  background:#f0f0f2;
  color:#111;
  border-color:#ccc;
}

.light .ai{
  background:#e5e5ea;
  color:#111;
}

.light .welcome h1{
  color:#111;
}

.light #settings-panel{
  background:#fff;
  color:#111;
  border-color:#ddd;
}

/* DESKTOP */
@media(min-width:700px){

  #chat{
    padding-left:20%;
    padding-right:20%;
  }

  form{
    padding-left:20%;
    padding-right:20%;
  }

}
</style>
</head>

<body>

<div class="app">

<header>

  <div>
    <span class="logo">🌌 Galaxy AI</span>
    <span class="version">V3.0</span>
  </div>

  <div class="header-buttons">
    <button id="newChat">＋ New</button>
    <button id="settings">⚙️</button>
  </div>

</header>

<!-- SETTINGS -->
<div id="settings-panel">

  <h3>Galaxy AI Settings</h3>

  <div class="setting">
    <span>Theme</span>
    <button id="themeBtn">🌙</button>
  </div>

  <div class="setting">
    <span>Read Aloud</span>
    <button id="voiceBtn">🔊</button>
  </div>

</div>

<!-- CHAT -->
<main id="chat">

  <div id="welcome" class="welcome">
    <h1>Galaxy AI</h1>
    <p>How can I help you today?</p>
  </div>

</main>

<!-- INPUT -->
<form id="form">

  <label
    class="tool-btn"
    title="Attach file"
    style="display:flex;align-items:center;justify-content:center;"
  >
    📎
    <input
      id="file"
      type="file"
      accept="image/*,.pdf,.txt"
    >
  </label>

  <button
    id="mic"
    class="tool-btn"
    type="button"
    title="Voice input"
  >
    🎙️
  </button>

  <input
    id="input"
    type="text"
    placeholder="Message Galaxy AI..."
    autocomplete="off"
  >

  <button
    id="send"
    type="submit"
    title="Send"
  >
    ➤
  </button>

</form>

</div>

<script>

/* =========================
   ELEMENTS
========================= */

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const form = document.getElementById("form");

const mic = document.getElementById("mic");
const file = document.getElementById("file");

const newChat = document.getElementById("newChat");
const settings = document.getElementById("settings");

const settingsPanel =
  document.getElementById("settings-panel");

const themeBtn =
  document.getElementById("themeBtn");

const voiceBtn =
  document.getElementById("voiceBtn");


/* =========================
   VARIABLES
========================= */

let typingTimer = null;

let voiceEnabled = true;

let lastReply = "";


/* =========================
   ADD MESSAGE
========================= */

function addMessage(text,type){

  const welcome =
    document.getElementById("welcome");

  if(welcome){
    welcome.style.display = "none";
  }

  const message =
    document.createElement("div");

  message.className =
    "message " + type;

  message.textContent = text;

  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;

  return message;
}


/* =========================
   SAVE CHAT
========================= */

function saveChat(){

  localStorage.setItem(
    "galaxy_ai_v3_chat",
    chat.innerHTML
  );

}


/* =========================
   LOAD CHAT
========================= */

function loadChat(){

  const saved =
    localStorage.getItem(
      "galaxy_ai_v3_chat"
    );

  if(saved){

    chat.innerHTML = saved;

    chat.scrollTop =
      chat.scrollHeight;

  }

}


/* =========================
   NEW CHAT
========================= */

newChat.addEventListener(
  "click",
  function(){

    if(typingTimer){

      clearInterval(typingTimer);

      typingTimer = null;

    }

    localStorage.removeItem(
      "galaxy_ai_v3_chat"
    );

    chat.innerHTML = `
      <div id="welcome" class="welcome">
        <h1>Galaxy AI</h1>
        <p>How can I help you today?</p>
      </div>
    `;

    input.value = "";

    input.focus();

  }
);


/* =========================
   SETTINGS
========================= */

settings.addEventListener(
  "click",
  function(){

    if(
      settingsPanel.style.display ===
      "block"
    ){

      settingsPanel.style.display =
        "none";

    }else{

      settingsPanel.style.display =
        "block";

    }

  }
);


/* =========================
   THEME
========================= */

themeBtn.addEventListener(
  "click",
  function(){

    document.body.classList.toggle(
      "light"
    );

    const light =
      document.body.classList.contains(
        "light"
      );

    themeBtn.textContent =
      light ? "☀️" : "🌙";

    localStorage.setItem(
      "galaxy_ai_theme",
      light ? "light" : "dark"
    );

  }
);


/* LOAD THEME */

if(
  localStorage.getItem(
    "galaxy_ai_theme"
  ) === "light"
){

  document.body.classList.add(
    "light"
  );

  themeBtn.textContent = "☀️";

}


/* =========================
   VOICE SETTING
========================= */

voiceBtn.addEventListener(
  "click",
  function(){

    voiceEnabled =
      !voiceEnabled;

    voiceBtn.textContent =
      voiceEnabled
      ? "🔊"
      : "🔇";

  }
);


/* =========================
   READ ALOUD
========================= */

function speak(text){

  if(!voiceEnabled){
    return;
  }

  if(!("speechSynthesis" in window)){
    alert(
      "Read aloud is not supported."
    );
    return;
  }

  speechSynthesis.cancel();

  const speech =
    new SpeechSynthesisUtterance(text);

  speech.lang = "en-IN";

  speech.rate = 1;

  speech.pitch = 1;

  speechSynthesis.speak(speech);

}


/* =========================
   MIC / SPEECH RECOGNITION
========================= */

mic.addEventListener(
  "click",
  function(){

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if(!SpeechRecognition){

      alert(
        "Voice input is not supported in this browser. Try Chrome."
      );

      return;

    }

    const recognition =
      new SpeechRecognition();

    recognition.lang = "en-IN";

    recognition.interimResults =
      false;

    recognition.continuous =
      false;

    mic.textContent = "🔴";

    try{

      recognition.start();

    }catch(error){

      mic.textContent = "🎙️";

    }

    recognition.onresult =
      function(event){

        const transcript =
          event.results[0][0]
          .transcript;

        input.value =
          transcript;

        input.focus();

      };

    recognition.onend =
      function(){

        mic.textContent =
          "🎙️";

      };

    recognition.onerror =
      function(){

        mic.textContent =
          "🎙️";

      };

  }
);


/* =========================
   FILE BUTTON
========================= */

file.addEventListener(
  "change",
  function(){

    if(!file.files.length){
      return;
    }

    const selected =
      file.files[0];

    input.value =
      "📎 " + selected.name;

    input.focus();

  }
);


/* =========================
   COPY
========================= */

  if(
    navigator.clipboard &&
    navigator.clipboard.writeText
  ){

    navigator.clipboard.writeText(text);

  }else{

    const temp =
      document.createElement("
