<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Galaxy AI V3.0</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:#08080d;
color:#fff;
height:100vh;
overflow:hidden;
}

.app{
height:100vh;
display:flex;
flex-direction:column;
}

header{
height:64px;
flex-shrink:0;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 14px;
background:#111118;
border-bottom:1px solid #292934;
}

.logo{
font-size:20px;
font-weight:bold;
}

.version{
font-size:11px;
color:#888;
margin-left:5px;
}

.headerButtons{
display:flex;
gap:7px;
}

.headerButtons button{
border:0;
background:#252530;
color:#fff;
border-radius:10px;
padding:9px 11px;
font-size:13px;
}

#chat{
flex:1;
overflow-y:auto;
padding:20px 13px 105px;
scroll-behavior:smooth;
}

.welcome{
text-align:center;
margin-top:24vh;
color:#999;
}

.welcome h1{
font-size:30px;
color:#fff;
margin-bottom:8px;
}

.welcome p{
font-size:14px;
}

.msg{
max-width:88%;
padding:12px 14px;
margin:10px 0;
border-radius:17px;
line-height:1.5;
white-space:pre-wrap;
word-break:break-word;
}

.user{
margin-left:auto;
background:#315efb;
border-bottom-right-radius:5px;
}

.ai{
margin-right:auto;
background:#1d1d26;
border-bottom-left-radius:5px;
}

.thinking{
color:#999;
font-style:italic;
}

.actions{
display:flex;
gap:5px;
margin-top:7px;
}

.actions button{
border:0;
background:#292932;
color:#ccc;
padding:5px 8px;
border-radius:8px;
font-size:12px;
}

form{
position:fixed;
bottom:0;
left:0;
right:0;
display:flex;
gap:7px;
padding:10px;
background:#0b0b10;
border-top:1px solid #292934;
}

#input{
flex:1;
min-width:0;
border:1px solid #34343f;
outline:none;
border-radius:14px;
padding:13px 14px;
background:#17171e;
color:#fff;
font-size:15px;
}

#input:focus{
border-color:#526eff;
}

.toolBtn{
width:46px;
flex-shrink:0;
border:0;
border-radius:14px;
background:#252530;
color:#fff;
font-size:18px;
}

#send{
width:50px;
flex-shrink:0;
border:0;
border-radius:14px;
background:#315efb;
color:#fff;
font-size:19px;
}

button:active{
transform:scale(.94);
}

#file{
display:none;
}

#settingsPanel{
display:none;
position:fixed;
top:70px;
right:12px;
width:260px;
background:#181820;
border:1px solid #33333e;
border-radius:15px;
padding:15px;
z-index:20;
box-shadow:0 10px 30px #000;
}
